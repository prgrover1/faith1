function SettingsModal({ settings, onSave, onClose }) {
  const [biz, setBiz] = useState(settings.businessName || '');
  const [contact, setContact] = useState(settings.businessContact || '');
  const [addr, setAddr] = useState(settings.businessAddress || '');
  const [tmpl, setTmpl] = useState(settings.poTemplate || '');
  // Email account connection
  const [emEmail, setEmEmail] = useState(settings.smtpUser || '');
  const [emPass, setEmPass] = useState(settings.smtpPass || '');
  const [emProvider, setEmProvider] = useState(settings.smtpProvider || 'gmail');
  const [emTest, setEmTest] = useState(null); // null | 'testing' | 'ok' | 'fail'
  const [emError, setEmError] = useState('');
  const fileRef = React.useRef(null);

  const PROVIDERS = {
    gmail:   { label: 'Gmail',         host: 'smtp.gmail.com',      port: 465, help: 'Enable 2-Step Verification, then create an App Password named "Faith". Use that 16-char password here (NOT your normal Gmail password).' },
    outlook: { label: 'Outlook / Hotmail', host: 'smtp-mail.outlook.com', port: 587, help: 'Go to Microsoft account \u2192 Security \u2192 Advanced \u2192 App passwords. Create one named "Faith" and paste it here.' },
    yahoo:   { label: 'Yahoo',         host: 'smtp.mail.yahoo.com', port: 465, help: 'Yahoo \u2192 Account Security \u2192 Generate app password \u2192 name it "Faith". Paste that here.' },
    zoho:    { label: 'Zoho Mail',     host: 'smtp.zoho.com',       port: 465, help: 'Zoho \u2192 Settings \u2192 Security \u2192 App Passwords \u2192 create one named "Faith".' },
    other:   { label: 'Other (custom SMTP)', host: '', port: 465, help: 'Find your provider\u2019s SMTP host & port (search "[your provider] SMTP settings"). Use port 465 (SSL) or 587 (TLS). Most providers need an app password, not your login password.' },
  };
  const [customHost, setCustomHost] = useState(settings.smtpHost || '');
  const [customPort, setCustomPort] = useState(settings.smtpPort || 465);

  async function testEmail() {
    setEmTest('testing'); setEmError('');
    const prov = PROVIDERS[emProvider];
    const host = emProvider === 'other' ? customHost : prov.host;
    const port = emProvider === 'other' ? customPort : prov.port;
    if (!emEmail || !emPass || !host) { setEmTest('fail'); setEmError('Fill in email, password, and host'); return; }
    try {
      // Free server sleeps — first wake can take ~60s. Allow a generous timeout.
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 75000);
      const res = await fetch(`${FAITH_API}/api/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ smtpHost: host, smtpPort: port, smtpUser: emEmail, smtpPass: emPass }),
        signal: controller.signal,
      });
      clearTimeout(timer);
      const data = await res.json();
      if (data.ok) { setEmTest('ok'); } else { setEmTest('fail'); setEmError(data.error || 'Could not connect — check your email & app password'); }
    } catch(e) {
      setEmTest('fail');
      setEmError(e.name === 'AbortError'
        ? 'Server is waking up (free tier). Wait 30 seconds and click Test again.'
        : 'Could not reach server. Wait a moment and try again.');
    }
  }

  function handleFileUpload(file) {
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (ext === 'txt' || ext === 'md') {
      const r = new FileReader();
      r.onload = (e) => setTmpl(e.target.result);
      r.readAsText(file);
    } else if (ext === 'pdf') {
      const r = new FileReader();
      r.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const pdf = await window.pdfjsLib.getDocument({ data }).promise;
          let text = '';
          for (let i = 1; i <= pdf.numPages; i++) {
            const page = await pdf.getPage(i);
            const content = await page.getTextContent();
            text += content.items.map(t => t.str).join(' ') + '\n\n';
          }
          setTmpl(text.trim());
        } catch (err) {
          alert('Could not read that PDF. Please try a .docx or .txt instead.');
        }
      };
      r.readAsArrayBuffer(file);
    } else if (ext === 'docx') {
      const r = new FileReader();
      r.onload = async (e) => {
        try {
          const result = await window.mammoth.extractRawText({ arrayBuffer: e.target.result });
          setTmpl(result.value.trim());
        } catch (err) {
          alert('Could not read that Word doc. Please try a .pdf or .txt instead.');
        }
      };
      r.readAsArrayBuffer(file);
    } else if (ext === 'doc') {
      alert('Old .doc format isn\'t supported. Please save as .docx, .pdf, or .txt.');
    } else {
      alert('Unsupported file type. Use .pdf, .docx, or .txt.');
    }
  }

  return (
    <div style={{position:'fixed',inset:0,background:'oklch(0% 0 0 / 0.5)',zIndex:3000,display:'flex',alignItems:'center',justifyContent:'center',padding:'24px'}} onClick={onClose}>
      <div style={{background:'var(--surface)',borderRadius:16,width:'100%',maxWidth:640,maxHeight:'90vh',display:'flex',flexDirection:'column',boxShadow:'0 24px 80px oklch(0% 0 0 / 0.2)',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div>
            <div style={{fontWeight:700,fontSize:'1rem',letterSpacing:'-0.02em'}}>✦ Email & PO Settings</div>
            <div style={{fontSize:'0.78rem',color:'var(--fg-muted)',marginTop:2}}>Customize how Faith writes drafts on your behalf</div>
          </div>
          <button onClick={onClose} style={{background:'none',border:'none',cursor:'pointer',fontSize:'1.1rem',color:'var(--fg-muted)',padding:'4px 8px',borderRadius:6,fontFamily:'inherit'}}>✕</button>
        </div>

        <div style={{padding:'20px 24px',overflowY:'auto',flex:1}}>
          {/* EMAIL CONNECTION */}
          <div style={{marginBottom:24,paddingBottom:24,borderBottom:'1px solid var(--border)'}}>
            <div style={{fontSize:'0.78rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',color:'var(--fg-muted)',marginBottom:6}}>✉ Your Email Account</div>
            <div style={{fontSize:'0.78rem',color:'var(--fg-muted)',marginBottom:14,lineHeight:1.6}}>Connect your email so vendor orders send <strong>from your own address</strong>. Vendors reply directly to you.</div>

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Email provider</label>
            <select value={emProvider} onChange={e=>{setEmProvider(e.target.value);setEmTest(null);}} style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}>
              {Object.entries(PROVIDERS).map(([k,v])=> <option key={k} value={k}>{v.label}</option>)}
            </select>

            {emProvider === 'other' && (
              <div style={{display:'grid',gridTemplateColumns:'2fr 1fr',gap:12}}>
                <div><label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>SMTP host</label><input value={customHost} onChange={e=>setCustomHost(e.target.value)} placeholder="smtp.yourhost.com" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/></div>
                <div><label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Port</label><input type="number" value={customPort} onChange={e=>setCustomPort(e.target.value)} placeholder="465" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/></div>
              </div>
            )}

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Your email address</label>
            <input type="email" value={emEmail} onChange={e=>{setEmEmail(e.target.value);setEmTest(null);}} placeholder="you@yourbusiness.com" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/>

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>App password</label>
            <input type="password" value={emPass} onChange={e=>{setEmPass(e.target.value);setEmTest(null);}} placeholder="16-character app password" style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:6,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/>
            <div style={{fontSize:'0.72rem',color:'var(--fg-muted)',marginBottom:8,lineHeight:1.6,padding:'10px 12px',background:'var(--bg)',borderRadius:6,borderLeft:'3px solid var(--accent)'}}>
              <strong>Setup for {PROVIDERS[emProvider].label}:</strong> {PROVIDERS[emProvider].help}
              {emProvider==='gmail' && <> <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener" style={{color:'var(--accent)'}}>Open Gmail App Passwords →</a></>}
              {emProvider==='outlook' && <> <a href="https://account.microsoft.com/security" target="_blank" rel="noopener" style={{color:'var(--accent)'}}>Open Microsoft Security →</a></>}
              {emProvider==='yahoo' && <> <a href="https://login.yahoo.com/account/security" target="_blank" rel="noopener" style={{color:'var(--accent)'}}>Open Yahoo Security →</a></>}
              {emProvider==='zoho' && <> <a href="https://accounts.zoho.com/home#security" target="_blank" rel="noopener" style={{color:'var(--accent)'}}>Open Zoho Security →</a></>}
            </div>

            <div style={{display:'flex',alignItems:'center',gap:10}}>
              <button onClick={testEmail} disabled={emTest==='testing'} style={{background:'var(--bg)',border:'1.5px solid var(--border)',padding:'8px 16px',borderRadius:8,fontSize:'0.8rem',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>{emTest==='testing' ? 'Testing…' : 'Test connection'}</button>
              {emTest==='ok' && <span style={{fontSize:'0.8rem',color:'var(--accent)',fontWeight:600}}>✓ Connected! Emails will send from {emEmail}</span>}
              {emTest==='fail' && <span style={{fontSize:'0.8rem',color:'var(--red)'}}>⚠ {emError}</span>}
            </div>
          </div>

          <div style={{marginBottom:24}}>
            <div style={{fontSize:'0.78rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',color:'var(--fg-muted)',marginBottom:6}}>Business Info</div>
            <div style={{fontSize:'0.78rem',color:'var(--fg-muted)',marginBottom:14}}>Faith uses this in every email and PO it writes.</div>

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Business name</label>
            <input value={biz} onChange={e=>setBiz(e.target.value)} placeholder="e.g. Maple Grocers Ltd"
              style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/>

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Contact name (your name)</label>
            <input value={contact} onChange={e=>setContact(e.target.value)} placeholder="e.g. Jamie Rivera"
              style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',marginBottom:12,background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/>

            <label style={{display:'block',fontSize:'0.78rem',fontWeight:600,marginBottom:6}}>Business address</label>
            <textarea value={addr} onChange={e=>setAddr(e.target.value)} placeholder="123 Main St, City, State 12345"
              style={{width:'100%',padding:'10px 12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.85rem',outline:'none',minHeight:60,resize:'vertical',background:'var(--bg)',color:'var(--fg)',fontFamily:'inherit'}}/>
          </div>

          <div style={{borderTop:'1px solid var(--border)',paddingTop:20,marginTop:24}}>
            <div style={{fontSize:'0.78rem',fontWeight:700,textTransform:'uppercase',letterSpacing:'0.05em',color:'var(--fg-muted)',marginBottom:6}}>Purchase Order Template (optional)</div>
            <div style={{fontSize:'0.78rem',color:'var(--fg-muted)',marginBottom:14,lineHeight:1.6}}>If you have a PO template, paste or upload it below. Faith will fill it in for each order using its AI. Use placeholders like <code style={{background:'var(--bg)',padding:'1px 5px',borderRadius:4,fontSize:'0.75rem'}}>{`{product}`}</code>, <code style={{background:'var(--bg)',padding:'1px 5px',borderRadius:4,fontSize:'0.75rem'}}>{`{qty}`}</code>, <code style={{background:'var(--bg)',padding:'1px 5px',borderRadius:4,fontSize:'0.75rem'}}>{`{vendor}`}</code> — or just leave them blank and Claude will fill it from context.</div>

            <div style={{display:'flex',gap:8,marginBottom:10}}>
              <button onClick={()=>fileRef.current?.click()} style={{background:'var(--bg)',border:'1.5px solid var(--border)',padding:'8px 14px',borderRadius:8,fontSize:'0.78rem',fontWeight:600,cursor:'pointer',fontFamily:'inherit'}}>📎 Upload PDF / Word / .txt</button>
              {tmpl && <button onClick={()=>setTmpl('')} style={{background:'transparent',border:'1.5px solid var(--border)',padding:'8px 14px',borderRadius:8,fontSize:'0.78rem',fontWeight:600,cursor:'pointer',fontFamily:'inherit',color:'var(--fg-muted)'}}>Clear template</button>}
              <input ref={fileRef} type="file" accept=".pdf,.docx,.txt,.md,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain" style={{display:'none'}} onChange={e=>handleFileUpload(e.target.files[0])}/>
            </div>

            <textarea
              value={tmpl}
              onChange={e=>setTmpl(e.target.value)}
              placeholder={`PURCHASE ORDER\n\nPO Number: {po_number}\nDate: {date}\n\nFROM:\n{business_name}\n{business_address}\n\nTO:\n{vendor}\n\nITEMS:\n{product} (SKU: {sku}) — Qty: {qty} @ {unit_cost}/unit\n\nTotal: {total}\n\nPlease confirm receipt and estimated delivery.\n\n{contact_name}`}
              style={{width:'100%',minHeight:220,padding:'12px',borderRadius:8,border:'1.5px solid var(--border)',fontSize:'0.78rem',outline:'none',fontFamily:'monospace',background:'var(--bg)',color:'var(--fg)',resize:'vertical',whiteSpace:'pre-wrap'}}
            />
            <div style={{fontSize:'0.72rem',color:'var(--fg-muted)',marginTop:6}}>{tmpl ? `${tmpl.length} chars` : 'No template — Faith will write a clean email from scratch'}</div>
          </div>
        </div>

        <div style={{padding:'14px 24px',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'flex-end',gap:8,background:'var(--bg)'}}>
          <button onClick={onClose} style={{background:'transparent',border:'1.5px solid var(--border)',padding:'8px 18px',borderRadius:8,fontWeight:600,fontSize:'0.82rem',cursor:'pointer',fontFamily:'inherit'}}>Cancel</button>
          <button onClick={()=>{
            const prov = PROVIDERS[emProvider];
            onSave({
              businessName:biz, businessContact:contact, businessAddress:addr, poTemplate:tmpl,
              smtpUser: emEmail, smtpPass: emPass, smtpProvider: emProvider,
              smtpHost: emProvider==='other' ? customHost : prov.host,
              smtpPort: emProvider==='other' ? customPort : prov.port,
            });
          }} style={{background:'var(--accent)',color:'#fff',border:'none',padding:'8px 18px',borderRadius:8,fontWeight:700,fontSize:'0.82rem',cursor:'pointer',fontFamily:'inherit'}}>Save & Regenerate Drafts</button>
        </div>
        </div>
      </div>
  );
}
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
